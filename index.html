<script>
  const audio1 = document.getElementById('audio1');
  const track1 = document.getElementById('track1');

  track1.addEventListener('click', (e) => {
    e.preventDefault();

    if (audio1.paused) {
      audio1.play();
      track1.classList.add('active');
    } else {
      audio1.pause();
      track1.classList.remove('active');
    }
  });
</script>
