<!DOCTYPE html>

<body>
<div id="tracks">
  <a href="#" id="track1">track 1</a>
  <a href="#" id="track2">track 2</a>
</div>

<audio id="audio1" loop>
  <source src="track1.m4a" type="audio/mp4">
</audio>

<audio id="audio2" loop>
  <source src="track2.m4a" type="audio/mp4">
</audio>
<br>
<br>
<br>
  <section id="links">
    <a href="https://www.thepilot.site/02.html">TV Party</a>

  <div id="imageContainer">
    <img id="myImage" src="IMG_5389.JPG" alt="Flicker Image">
  </div>

  <section id="contact">
    <a href="mailto:yeshinyeshinyeshin@gmail.com">yeshinyeshinyeshin@gmail.com</a>
  </section>

  <script>
const imageList = [
  'IMG_5389.JPG','IMG_5055.JPG','IMG_5532.jpg','IMG_3683.JPG','IMG_5355.JPG',
  'IMG_4172.JPG','IMG_2420.JPG','IMG_6026.jpg','IMG_5541.jpg','IMG_6194.JPG',
  'IMG_8205.JPG','IMG_2234.JPG','IMG_3939.JPG','IMG_9955.JPG','IMG_4914.JPG'
];

let currentIndex = 0;
const imgElement = document.getElementById('myImage');

imgElement.addEventListener('click', (e) => {
  const rect = imgElement.getBoundingClientRect();
  const clickX = e.clientX - rect.left;

  if (clickX < rect.width / 2) {
    // Left half → previous image
    currentIndex = (currentIndex - 1 + imageList.length) % imageList.length;
  } else {
    // Right half → next image
    currentIndex = (currentIndex + 1) % imageList.length;
  }

  imgElement.src = imageList[currentIndex];
});

const audio1 = document.getElementById('audio1');
const audio2 = document.getElementById('audio2');

const track1 = document.getElementById('track1');
const track2 = document.getElementById('track2');

track1.addEventListener('click', (e) => {
  e.preventDefault();

  if (audio1.paused) {
    audio2.pause();

    audio1.play();

    track1.classList.add('active');
    track2.classList.remove('active');
  } else {
    audio1.pause();
    track1.classList.remove('active');
  }
});

track2.addEventListener('click', (e) => {
  e.preventDefault();

  if (audio2.paused) {
    audio1.pause();

    audio2.play();

    track2.classList.add('active');
    track1.classList.remove('active');
  } else {
    audio2.pause();
    track2.classList.remove('active');
  }
});
    
  </script>

</body>
</html>
